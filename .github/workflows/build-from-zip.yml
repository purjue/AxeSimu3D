name: Build APK from zip
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        run: |
          ZIP="$(ls -1 *.zip | head -n 1)"
          unzip -o "$ZIP" -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download stb_image
        run: |
          curl -fsSL --retry 4 --retry-delay 3 https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o project/app/src/main/cpp/stb_image.h \
            || echo "WARNING no textures"
      - name: Install Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - name: Build the APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk AxeSimulator3D.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AxeSimulator3D.apk --target "$GITHUB_SHA" --title "Axe Simulator 3D APK" --notes "Download and install."
